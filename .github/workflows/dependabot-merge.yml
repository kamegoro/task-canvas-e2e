name: Dependabot Auto-merge

# Runs each time one of the other checks finishes, instead of polling a
# single long-running job for up to 30 minutes. workflow_run always uses
# the version of this file on the default branch, so a fix here applies
# to every open Dependabot PR immediately without needing to rebase them.
on:
  workflow_run:
    types: [completed]
    workflows:
      - "Build"
      - "Dependabot Approve"

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.pull_requests[0] != null
    steps:
      - name: Merge if the PR is Dependabot-approved and every check is green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail

          pr_json=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json author,state,reviews)
          author=$(jq -r '.author.login' <<<"$pr_json")
          state=$(jq -r '.state' <<<"$pr_json")

          if [ "$author" != "app/dependabot" ] || [ "$state" != "OPEN" ]; then
            echo "PR #$PR_NUMBER is not an open Dependabot PR, skipping."
            exit 0
          fi

          approved=$(jq '[.reviews[] | select(.author.login == "github-actions" and .state == "APPROVED")] | length' <<<"$pr_json")
          if [ "$approved" -lt 1 ]; then
            echo "PR #$PR_NUMBER has no Dependabot-approve review yet (not semver patch/minor, or the approve workflow hasn't finished), skipping."
            exit 0
          fi

          # Exclude this job's own check run by name so it never waits on itself.
          check_runs=$(gh api "repos/$REPO/commits/$SHA/check-runs" --paginate --jq '[.check_runs[] | select(.name != "auto-merge")]')

          incomplete=$(jq '[.[] | select(.status != "completed")] | length' <<<"$check_runs")
          if [ "$incomplete" -gt 0 ]; then
            echo "Some checks on $SHA are still running, skipping (a later check completion will re-trigger this)."
            exit 0
          fi

          failed=$(jq '[.[] | select(.conclusion != "success" and .conclusion != "neutral" and .conclusion != "skipped")] | length' <<<"$check_runs")
          if [ "$failed" -gt 0 ]; then
            echo "Some checks on $SHA did not pass, not merging."
            jq -r '.[] | select(.conclusion != "success" and .conclusion != "neutral" and .conclusion != "skipped") | "  \(.name): \(.conclusion // .status)"' <<<"$check_runs"
            exit 0
          fi

          echo "All checks on $SHA are green and PR #$PR_NUMBER is approved — merging."
          gh pr merge "$PR_NUMBER" --repo "$REPO" --squash || echo "Merge attempt failed, likely already merged by a concurrent run."
